<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura en tres capas</title><desc id="desc">UI llama a Negocio, que llama al Repositorio. El repositorio se conecta con PostgreSQL. Main ensambla las capas.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfdfe"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="38" font-size="23" fill="#173047" text-anchor="start" font-weight="700">Arquitectura de ejecución · tres capas</text><rect x="40" y="90" width="270" height="150" rx="10" fill="#e6f3ef" stroke="#d7e4e9"/><text x="58" y="128" font-size="22" fill="#173047" text-anchor="start" font-weight="700">UI / PySide6</text><text x="58" y="165" font-size="13" fill="#173047" text-anchor="start" font-weight="400">VentanaPrincipal · Formulario</text><text x="58" y="193" font-size="13" fill="#173047" text-anchor="start" font-weight="400">Trabajo · QThreadPool</text><line x1="312" y1="144" x2="346" y2="144" stroke="#6d8b98" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="346" y1="193" x2="312" y2="193" stroke="#6d8b98" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="350" y="90" width="270" height="150" rx="10" fill="#eaf0f8" stroke="#d7e4e9"/><text x="368" y="128" font-size="22" fill="#173047" text-anchor="start" font-weight="700">Negocio</text><text x="368" y="165" font-size="13" fill="#173047" text-anchor="start" font-weight="400">ServicioGestion · validar</text><text x="368" y="193" font-size="13" fill="#173047" text-anchor="start" font-weight="400">ENTIDADES · Campo · Entidad</text><line x1="622" y1="144" x2="656" y2="144" stroke="#6d8b98" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="656" y1="193" x2="622" y2="193" stroke="#6d8b98" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="660" y="90" width="270" height="150" rx="10" fill="#eaf0f8" stroke="#d7e4e9"/><text x="678" y="128" font-size="22" fill="#173047" text-anchor="start" font-weight="700">Acceso a datos</text><text x="678" y="165" font-size="13" fill="#173047" text-anchor="start" font-weight="400">Repositorio · sesion</text><text x="678" y="193" font-size="13" fill="#173047" text-anchor="start" font-weight="400">Psycopg · SQL parametrizado</text><line x1="932" y1="144" x2="966" y2="144" stroke="#6d8b98" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="966" y1="193" x2="932" y2="193" stroke="#6d8b98" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="970" y="90" width="270" height="150" rx="10" fill="#fff2d9" stroke="#d7e4e9"/><text x="988" y="128" font-size="22" fill="#173047" text-anchor="start" font-weight="700">PostgreSQL</text><text x="988" y="165" font-size="13" fill="#173047" text-anchor="start" font-weight="400">Base proyecto · 25 tablas</text><text x="988" y="193" font-size="13" fill="#173047" text-anchor="start" font-weight="400">PK · FK · UNIQUE · CHECK</text><rect x="40" y="285" width="1200" height="84" rx="10" fill="#f0f5f8" stroke="#d7e4e9"/><text x="62" y="316" font-size="16" fill="#173047" text-anchor="start" font-weight="600">main.py ensambla las capas e inyecta Repositorio en ServicioGestion.</text><text x="62" y="345" font-size="15" fill="#173047" text-anchor="start" font-weight="400">config.py carga .env; start.bat inicia main.py. Los widgets nunca ejecutan SQL.</text></g></svg>