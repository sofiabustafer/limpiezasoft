<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="975" viewBox="0 0 1400 975" role="img" aria-labelledby="title desc">
<title id="title">SQ06 · Eliminar un registro</title><desc id="desc">Diagrama UML de secuencia entre Operador, UI, Negocio, Repositorio y PostgreSQL. Los fragmentos alt muestran caminos excluyentes; líneas discontinuas indican retornos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfdfe"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="33" font-size="23" fill="#173047" text-anchor="start" font-weight="700">SQ06 · Eliminar un registro</text><line x1="90" y1="113" x2="90" y2="945" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="10" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="90" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Operador</text><text x="90" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Actor</text><line x1="340" y1="113" x2="340" y2="945" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="260" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="340" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">UI / Trabajo</text><text x="340" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Qt + QThreadPool</text><line x1="630" y1="113" x2="630" y2="945" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="550" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="630" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">ServicioGestion</text><text x="630" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Negocio</text><line x1="935" y1="113" x2="935" y2="945" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="855" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="935" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Repositorio</text><text x="935" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Acceso a datos</text><line x1="1230" y1="113" x2="1230" y2="945" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1150" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="1230" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">PostgreSQL</text><text x="1230" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Persistencia</text><line x1="90" y1="176" x2="340" y2="176" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="142" font-size="12" fill="#173047" text-anchor="start" font-weight="400">1. Seleccionar fila y pulsar</text><text x="100" y="160" font-size="12" fill="#173047" text-anchor="start" font-weight="400">Eliminar</text><line x1="340" y1="244" x2="90" y2="244" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="100" y="210" font-size="12" fill="#173047" text-anchor="start" font-weight="400">2. Solicitar confirmación y</text><text x="100" y="228" font-size="12" fill="#173047" text-anchor="start" font-weight="400">advertir cascadas</text><rect x="30" y="276" width="1340" height="624" rx="0" fill="none" stroke="#9db7bf"/><text x="48" y="300" font-size="14" fill="#087f72" text-anchor="start" font-weight="700">alt [usuario cancela]</text><line x1="90" y1="369" x2="340" y2="369" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="335" font-size="12" fill="#173047" text-anchor="start" font-weight="400">3. No: cerrar confirmación sin</text><text x="100" y="353" font-size="12" fill="#173047" text-anchor="start" font-weight="400">escribir</text><line x1="30" y1="401" x2="1370" y2="401" stroke="#6d8b98" stroke-width="1.6" stroke-dasharray="6 5"/><text x="48" y="425" font-size="14" fill="#087f72" text-anchor="start" font-weight="700">[usuario confirma]</text><line x1="90" y1="476" x2="340" y2="476" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="460" font-size="12" fill="#173047" text-anchor="start" font-weight="400">4. Sí</text><line x1="340" y1="526" x2="630" y2="526" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350" y="510" font-size="12" fill="#173047" text-anchor="start" font-weight="400">5. eliminar(tabla, registro)</text><line x1="630" y1="576" x2="935" y2="576" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="560" font-size="12" fill="#173047" text-anchor="start" font-weight="400">6. Abrir sesión de escritura</text><line x1="935" y1="626" x2="1230" y2="626" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="610" font-size="12" fill="#173047" text-anchor="start" font-weight="400">7. Adquirir bloqueo; DELETE por PK</text><line x1="1230" y1="676" x2="935" y2="676" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="945" y="660" font-size="12" fill="#173047" text-anchor="start" font-weight="400">8. Aplicar FK y CASCADE</text><path d="M 630 744 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="640" y="710" font-size="12" fill="#173047" text-anchor="start" font-weight="400">9. Actualizar totales si</text><text x="640" y="728" font-size="12" fill="#173047" text-anchor="start" font-weight="400">corresponde</text><line x1="935" y1="818" x2="1230" y2="818" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="802" font-size="12" fill="#173047" text-anchor="start" font-weight="400">10. COMMIT</text><line x1="630" y1="868" x2="340" y2="868" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="852" font-size="12" fill="#173047" text-anchor="start" font-weight="400">11. Recargar lista</text></g></svg>