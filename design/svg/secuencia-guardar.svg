<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1143" viewBox="0 0 1400 1143" role="img" aria-labelledby="title desc">
<title id="title">SQ02 · Guardar un registro</title><desc id="desc">Diagrama UML de secuencia entre Operador, UI, Negocio, Repositorio y PostgreSQL. Los fragmentos alt muestran caminos excluyentes; líneas discontinuas indican retornos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfdfe"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="33" font-size="23" fill="#173047" text-anchor="start" font-weight="700">SQ02 · Guardar un registro</text><line x1="90" y1="113" x2="90" y2="1113" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="10" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="90" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Operador</text><text x="90" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Actor</text><line x1="340" y1="113" x2="340" y2="1113" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="260" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="340" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">UI / Trabajo</text><text x="340" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Qt + QThreadPool</text><line x1="630" y1="113" x2="630" y2="1113" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="550" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="630" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">ServicioGestion</text><text x="630" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Negocio</text><line x1="935" y1="113" x2="935" y2="1113" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="855" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="935" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Repositorio</text><text x="935" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Acceso a datos</text><line x1="1230" y1="113" x2="1230" y2="1113" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1150" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="1230" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">PostgreSQL</text><text x="1230" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Persistencia</text><line x1="90" y1="176" x2="340" y2="176" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="142" font-size="12" fill="#173047" text-anchor="start" font-weight="400">1. Completar formulario y pulsar</text><text x="100" y="160" font-size="12" fill="#173047" text-anchor="start" font-weight="400">Guardar</text><line x1="340" y1="226" x2="630" y2="226" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350" y="210" font-size="12" fill="#173047" text-anchor="start" font-weight="400">2. guardar(tabla, valores, anterior)</text><path d="M 630 294 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="640" y="260" font-size="12" fill="#173047" text-anchor="start" font-weight="400">3. validar(): tipos,</text><text x="640" y="278" font-size="12" fill="#173047" text-anchor="start" font-weight="400">requeridos y longitudes</text><rect x="30" y="350" width="1340" height="718" rx="0" fill="none" stroke="#9db7bf"/><text x="48" y="374" font-size="14" fill="#087f72" text-anchor="start" font-weight="700">alt [datos inválidos]</text><line x1="630" y1="425" x2="340" y2="425" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="409" font-size="12" fill="#173047" text-anchor="start" font-weight="400">4. ErrorValidacion</text><line x1="340" y1="493" x2="90" y2="493" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="100" y="459" font-size="12" fill="#173047" text-anchor="start" font-weight="400">5. Mostrar error; conservar</text><text x="100" y="477" font-size="12" fill="#173047" text-anchor="start" font-weight="400">formulario</text><line x1="30" y1="525" x2="1370" y2="525" stroke="#6d8b98" stroke-width="1.6" stroke-dasharray="6 5"/><text x="48" y="549" font-size="14" fill="#087f72" text-anchor="start" font-weight="700">[datos válidos]</text><line x1="630" y1="600" x2="935" y2="600" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="584" font-size="12" fill="#173047" text-anchor="start" font-weight="400">6. sesion(escritura=True)</text><line x1="935" y1="668" x2="1230" y2="668" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="634" font-size="12" fill="#173047" text-anchor="start" font-weight="400">7. Conectar y adquirir bloqueo</text><text x="945" y="652" font-size="12" fill="#173047" text-anchor="start" font-weight="400">transaccional</text><line x1="630" y1="718" x2="935" y2="718" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="702" font-size="12" fill="#173047" text-anchor="start" font-weight="400">8. guardar(): alta o edición</text><line x1="935" y1="768" x2="1230" y2="768" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="752" font-size="12" fill="#173047" text-anchor="start" font-weight="400">9. INSERT / UPDATE parametrizado</text><line x1="1230" y1="818" x2="935" y2="818" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="945" y="802" font-size="12" fill="#173047" text-anchor="start" font-weight="400">10. Restricciones satisfechas</text><line x1="935" y1="868" x2="1230" y2="868" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="852" font-size="12" fill="#173047" text-anchor="start" font-weight="400">11. COMMIT y cerrar conexión</text><line x1="935" y1="918" x2="630" y2="918" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="640" y="902" font-size="12" fill="#173047" text-anchor="start" font-weight="400">12. Fin de sesión</text><line x1="630" y1="968" x2="340" y2="968" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="952" font-size="12" fill="#173047" text-anchor="start" font-weight="400">13. Operación completada</text><line x1="340" y1="1036" x2="90" y2="1036" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="100" y="1002" font-size="12" fill="#173047" text-anchor="start" font-weight="400">14. Cerrar formulario y recargar</text><text x="100" y="1020" font-size="12" fill="#173047" text-anchor="start" font-weight="400">lista</text></g></svg>