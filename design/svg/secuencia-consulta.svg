<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">SQ01 · Buscar y paginar registros</title><desc id="desc">Diagrama UML de secuencia entre Operador, UI, Negocio, Repositorio y PostgreSQL. Los fragmentos alt muestran caminos excluyentes; líneas discontinuas indican retornos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfdfe"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="33" font-size="23" fill="#173047" text-anchor="start" font-weight="700">SQ01 · Buscar y paginar registros</text><line x1="90" y1="113" x2="90" y2="730" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="10" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="90" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Operador</text><text x="90" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Actor</text><line x1="340" y1="113" x2="340" y2="730" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="260" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="340" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">UI / Trabajo</text><text x="340" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Qt + QThreadPool</text><line x1="630" y1="113" x2="630" y2="730" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="550" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="630" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">ServicioGestion</text><text x="630" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Negocio</text><line x1="935" y1="113" x2="935" y2="730" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="855" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="935" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Repositorio</text><text x="935" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Acceso a datos</text><line x1="1230" y1="113" x2="1230" y2="730" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1150" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="1230" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">PostgreSQL</text><text x="1230" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Persistencia</text><line x1="90" y1="158" x2="340" y2="158" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="142" font-size="12" fill="#173047" text-anchor="start" font-weight="400">1. Buscar texto / cambiar página</text><rect x="220" y="190" width="1080" height="43" rx="5" fill="#fff5df" stroke="#ecdfb9"/><text x="237" y="214" font-size="13" fill="#173047" text-anchor="start" font-weight="400">La UI deshabilita acciones y envía Trabajo a QThreadPool; la ventana sigue procesando eventos.</text><line x1="340" y1="275" x2="630" y2="275" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350" y="259" font-size="12" fill="#173047" text-anchor="start" font-weight="400">2. listar(tabla, búsqueda, página)</text><line x1="630" y1="325" x2="935" y2="325" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="309" font-size="12" fill="#173047" text-anchor="start" font-weight="400">3. sesion() / listar(...)</text><line x1="935" y1="375" x2="1230" y2="375" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="359" font-size="12" fill="#173047" text-anchor="start" font-weight="400">4. Conectar; COUNT y SELECT con parámetros</text><line x1="1230" y1="443" x2="935" y2="443" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="945" y="409" font-size="12" fill="#173047" text-anchor="start" font-weight="400">5. Filas sin password_hash y cantidad</text><text x="945" y="427" font-size="12" fill="#173047" text-anchor="start" font-weight="400">total</text><line x1="935" y1="493" x2="630" y2="493" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="640" y="477" font-size="12" fill="#173047" text-anchor="start" font-weight="400">6. Cerrar conexión; devolver resultados</text><line x1="630" y1="543" x2="340" y2="543" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="527" font-size="12" fill="#173047" text-anchor="start" font-weight="400">7. (filas, total)</text><rect x="220" y="575" width="1080" height="43" rx="5" fill="#fff5df" stroke="#ecdfb9"/><text x="237" y="599" font-size="13" fill="#173047" text-anchor="start" font-weight="400">Se consultan los catálogos de las FK mediante opciones() para mostrar nombres e identificadores.</text><line x1="340" y1="678" x2="90" y2="678" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="100" y="644" font-size="12" fill="#173047" text-anchor="start" font-weight="400">8. Señal de finalización; tabla y</text><text x="100" y="662" font-size="12" fill="#173047" text-anchor="start" font-weight="400">paginación</text></g></svg>