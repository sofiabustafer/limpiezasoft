<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1274" viewBox="0 0 1400 1274" role="img" aria-labelledby="title desc">
<title id="title">SQ05 · Cambiar un detalle de compra</title><desc id="desc">Diagrama UML de secuencia entre Operador, UI, Negocio, Repositorio y PostgreSQL. Los fragmentos alt muestran caminos excluyentes; líneas discontinuas indican retornos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfdfe"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="33" font-size="23" fill="#173047" text-anchor="start" font-weight="700">SQ05 · Cambiar un detalle de compra</text><line x1="90" y1="113" x2="90" y2="1244" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="10" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="90" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Operador</text><text x="90" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Actor</text><line x1="340" y1="113" x2="340" y2="1244" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="260" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="340" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">UI / Trabajo</text><text x="340" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Qt + QThreadPool</text><line x1="630" y1="113" x2="630" y2="1244" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="550" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="630" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">ServicioGestion</text><text x="630" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Negocio</text><line x1="935" y1="113" x2="935" y2="1244" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="855" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="935" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Repositorio</text><text x="935" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Acceso a datos</text><line x1="1230" y1="113" x2="1230" y2="1244" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1150" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="1230" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">PostgreSQL</text><text x="1230" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Persistencia</text><line x1="90" y1="176" x2="340" y2="176" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="142" font-size="12" fill="#173047" text-anchor="start" font-weight="400">1. Editar o eliminar detalle de</text><text x="100" y="160" font-size="12" fill="#173047" text-anchor="start" font-weight="400">compra</text><line x1="340" y1="226" x2="630" y2="226" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350" y="210" font-size="12" fill="#173047" text-anchor="start" font-weight="400">2. guardar(...) o eliminar(...)</text><rect x="220" y="258" width="1080" height="43" rx="5" fill="#fff5df" stroke="#ecdfb9"/><text x="237" y="282" font-size="13" fill="#173047" text-anchor="start" font-weight="400">La edición valida los campos; la eliminación parte del registro seleccionado y confirmado.</text><line x1="630" y1="343" x2="935" y2="343" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="327" font-size="12" fill="#173047" text-anchor="start" font-weight="400">3. Abrir sesión de escritura</text><line x1="935" y1="393" x2="1230" y2="393" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="377" font-size="12" fill="#173047" text-anchor="start" font-weight="400">4. Adquirir bloqueo transaccional</text><line x1="630" y1="443" x2="935" y2="443" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="427" font-size="12" fill="#173047" text-anchor="start" font-weight="400">5. Guardar o eliminar detalle</text><line x1="935" y1="493" x2="1230" y2="493" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="477" font-size="12" fill="#173047" text-anchor="start" font-weight="400">6. INSERT / UPDATE / DELETE provisional</text><path d="M 630 561 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="640" y="527" font-size="12" fill="#173047" text-anchor="start" font-weight="400">7. Identificar órdenes</text><text x="640" y="545" font-size="12" fill="#173047" text-anchor="start" font-weight="400">anterior y nueva</text><line x1="630" y1="635" x2="935" y2="635" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="619" font-size="12" fill="#173047" text-anchor="start" font-weight="400">8. recalcular() por cada orden</text><line x1="935" y1="685" x2="1230" y2="685" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="669" font-size="12" fill="#173047" text-anchor="start" font-weight="400">9. UPDATE total = SUM(cantidad × costo)</text><line x1="630" y1="735" x2="935" y2="735" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="719" font-size="12" fill="#173047" text-anchor="start" font-weight="400">10. saldo_orden() por cada orden</text><line x1="935" y1="785" x2="1230" y2="785" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="769" font-size="12" fill="#173047" text-anchor="start" font-weight="400">11. Consultar total y pagos acumulados</text><rect x="30" y="817" width="1340" height="382" rx="0" fill="none" stroke="#9db7bf"/><text x="48" y="841" font-size="14" fill="#087f72" text-anchor="start" font-weight="700">alt [ninguna orden queda sobrepagada]</text><line x1="935" y1="892" x2="1230" y2="892" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="876" font-size="12" fill="#173047" text-anchor="start" font-weight="400">12. COMMIT</text><line x1="630" y1="942" x2="340" y2="942" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="926" font-size="12" fill="#173047" text-anchor="start" font-weight="400">13. Completar y recargar lista</text><line x1="30" y1="974" x2="1370" y2="974" stroke="#6d8b98" stroke-width="1.6" stroke-dasharray="6 5"/><text x="48" y="998" font-size="14" fill="#087f72" text-anchor="start" font-weight="700">[alguna orden queda sobrepagada]</text><line x1="630" y1="1049" x2="935" y2="1049" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="1033" font-size="12" fill="#173047" text-anchor="start" font-weight="400">14. ErrorValidacion</text><line x1="935" y1="1099" x2="1230" y2="1099" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="1083" font-size="12" fill="#173047" text-anchor="start" font-weight="400">15. ROLLBACK: restaurar detalles y totales</text><line x1="630" y1="1167" x2="340" y2="1167" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="1133" font-size="12" fill="#173047" text-anchor="start" font-weight="400">16. Informar que los pagos superan el</text><text x="350" y="1151" font-size="12" fill="#173047" text-anchor="start" font-weight="400">total</text></g></svg>