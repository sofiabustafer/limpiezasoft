<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1059" viewBox="0 0 1400 1059" role="img" aria-labelledby="title desc">
<title id="title">SQ03 · Modificar un detalle de venta</title><desc id="desc">Diagrama UML de secuencia entre Operador, UI, Negocio, Repositorio y PostgreSQL. Los fragmentos alt muestran caminos excluyentes; líneas discontinuas indican retornos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfdfe"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="33" font-size="23" fill="#173047" text-anchor="start" font-weight="700">SQ03 · Modificar un detalle de venta</text><line x1="90" y1="113" x2="90" y2="1029" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="10" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="90" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Operador</text><text x="90" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Actor</text><line x1="340" y1="113" x2="340" y2="1029" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="260" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="340" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">UI / Trabajo</text><text x="340" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Qt + QThreadPool</text><line x1="630" y1="113" x2="630" y2="1029" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="550" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="630" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">ServicioGestion</text><text x="630" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Negocio</text><line x1="935" y1="113" x2="935" y2="1029" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="855" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="935" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Repositorio</text><text x="935" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Acceso a datos</text><line x1="1230" y1="113" x2="1230" y2="1029" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1150" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="1230" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">PostgreSQL</text><text x="1230" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Persistencia</text><line x1="90" y1="158" x2="340" y2="158" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="142" font-size="12" fill="#173047" text-anchor="start" font-weight="400">1. Guardar detalle de venta</text><line x1="340" y1="226" x2="630" y2="226" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350" y="192" font-size="12" fill="#173047" text-anchor="start" font-weight="400">2. guardar(detalle_ventas, valores,</text><text x="350" y="210" font-size="12" fill="#173047" text-anchor="start" font-weight="400">anterior)</text><path d="M 630 294 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="640" y="260" font-size="12" fill="#173047" text-anchor="start" font-weight="400">3. Validar cantidad &gt; 0 y</text><text x="640" y="278" font-size="12" fill="#173047" text-anchor="start" font-weight="400">precio ≥ 0</text><line x1="630" y1="368" x2="935" y2="368" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="352" font-size="12" fill="#173047" text-anchor="start" font-weight="400">4. Abrir sesión de escritura</text><line x1="935" y1="418" x2="1230" y2="418" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="402" font-size="12" fill="#173047" text-anchor="start" font-weight="400">5. Adquirir bloqueo transaccional</text><line x1="630" y1="468" x2="935" y2="468" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="452" font-size="12" fill="#173047" text-anchor="start" font-weight="400">6. guardar(detalle)</text><line x1="935" y1="518" x2="1230" y2="518" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="502" font-size="12" fill="#173047" text-anchor="start" font-weight="400">7. INSERT / UPDATE del detalle</text><line x1="1230" y1="568" x2="935" y2="568" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="945" y="552" font-size="12" fill="#173047" text-anchor="start" font-weight="400">8. Calcular subtotal generado</text><path d="M 630 636 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="640" y="602" font-size="12" fill="#173047" text-anchor="start" font-weight="400">9. _actualizar_totales():</text><text x="640" y="620" font-size="12" fill="#173047" text-anchor="start" font-weight="400">padres afectados</text><rect x="220" y="692" width="1080" height="43" rx="5" fill="#fff5df" stroke="#ecdfb9"/><text x="237" y="716" font-size="13" fill="#173047" text-anchor="start" font-weight="400">Repetir para cada venta afectada: la anterior y la nueva si se movió el detalle.</text><line x1="630" y1="777" x2="935" y2="777" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="761" font-size="12" fill="#173047" text-anchor="start" font-weight="400">10. recalcular(detalle_ventas, venta_id)</text><line x1="935" y1="827" x2="1230" y2="827" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="811" font-size="12" fill="#173047" text-anchor="start" font-weight="400">11. UPDATE ventas: SUM(subtotal) o cero</text><line x1="935" y1="877" x2="1230" y2="877" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="861" font-size="12" fill="#173047" text-anchor="start" font-weight="400">12. COMMIT de detalle y totales</text><line x1="630" y1="927" x2="340" y2="927" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="911" font-size="12" fill="#173047" text-anchor="start" font-weight="400">13. Operación completada</text><line x1="340" y1="977" x2="90" y2="977" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="100" y="961" font-size="12" fill="#173047" text-anchor="start" font-weight="400">14. Recargar detalle de ventas</text></g></svg>