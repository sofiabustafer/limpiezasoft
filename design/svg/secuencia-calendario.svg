<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1019" viewBox="0 0 1400 1019" role="img" aria-labelledby="title desc">
<title id="title">SQ07 · Consultar calendario y detalle</title><desc id="desc">Diagrama UML de secuencia entre Operador, UI, Negocio, Repositorio y PostgreSQL. Los fragmentos alt muestran caminos excluyentes; líneas discontinuas indican retornos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfdfe"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="33" font-size="23" fill="#173047" text-anchor="start" font-weight="700">SQ07 · Consultar calendario y detalle</text><line x1="90" y1="113" x2="90" y2="989" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="10" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="90" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Operador</text><text x="90" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Actor</text><line x1="340" y1="113" x2="340" y2="989" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="260" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="340" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">UI / Trabajo</text><text x="340" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Qt + QThreadPool</text><line x1="630" y1="113" x2="630" y2="989" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="550" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="630" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">ServicioGestion</text><text x="630" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Negocio</text><line x1="935" y1="113" x2="935" y2="989" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="855" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="935" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Repositorio</text><text x="935" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Acceso a datos</text><line x1="1230" y1="113" x2="1230" y2="989" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1150" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="1230" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">PostgreSQL</text><text x="1230" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Persistencia</text><line x1="90" y1="158" x2="340" y2="158" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="142" font-size="12" fill="#173047" text-anchor="start" font-weight="400">1. Abrir Vista general o actualizar</text><rect x="220" y="190" width="1080" height="43" rx="5" fill="#fff5df" stroke="#ecdfb9"/><text x="237" y="214" font-size="13" fill="#173047" text-anchor="start" font-weight="400">El trabajador obtiene los indicadores de resumen y luego el calendario semanal.</text><line x1="340" y1="275" x2="630" y2="275" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350" y="259" font-size="12" fill="#173047" text-anchor="start" font-weight="400">2. agenda_semanal()</text><path d="M 630 343 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="640" y="309" font-size="12" fill="#173047" text-anchor="start" font-weight="400">3. Calcular lunes local y</text><text x="640" y="327" font-size="12" fill="#173047" text-anchor="start" font-weight="400">lunes siguiente</text><line x1="630" y1="417" x2="935" y2="417" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="401" font-size="12" fill="#173047" text-anchor="start" font-weight="400">4. sesion() / agenda_semanal(inicio, fin)</text><line x1="935" y1="467" x2="1230" y2="467" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="451" font-size="12" fill="#173047" text-anchor="start" font-weight="400">5. SELECT por rango con JOIN de detalles</text><line x1="1230" y1="535" x2="935" y2="535" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="945" y="501" font-size="12" fill="#173047" text-anchor="start" font-weight="400">6. Citas, nombres, color del estado y</text><text x="945" y="519" font-size="12" fill="#173047" text-anchor="start" font-weight="400">factura</text><line x1="935" y1="585" x2="630" y2="585" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="640" y="569" font-size="12" fill="#173047" text-anchor="start" font-weight="400">7. Resultados; cerrar conexión</text><line x1="630" y1="635" x2="340" y2="635" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="619" font-size="12" fill="#173047" text-anchor="start" font-weight="400">8. Semana y servicios</text><path d="M 340 703 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="350" y="669" font-size="12" fill="#173047" text-anchor="start" font-weight="400">9. Agrupar por día y hora;</text><text x="350" y="687" font-size="12" fill="#173047" text-anchor="start" font-weight="400">pintar colores</text><line x1="90" y1="777" x2="340" y2="777" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="761" font-size="12" fill="#173047" text-anchor="start" font-weight="400">10. Hacer clic en una cita</text><path d="M 340 845 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="350" y="811" font-size="12" fill="#173047" text-anchor="start" font-weight="400">11. Abrir DetalleServicio con</text><text x="350" y="829" font-size="12" fill="#173047" text-anchor="start" font-weight="400">datos cargados</text><line x1="340" y1="937" x2="90" y2="937" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="100" y="903" font-size="12" fill="#173047" text-anchor="start" font-weight="400">12. Mostrar detalle de cita y</text><text x="100" y="921" font-size="12" fill="#173047" text-anchor="start" font-weight="400">contactos</text></g></svg>