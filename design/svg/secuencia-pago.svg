<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1307" viewBox="0 0 1400 1307" role="img" aria-labelledby="title desc">
<title id="title">SQ04 · Guardar un pago y controlar el saldo</title><desc id="desc">Diagrama UML de secuencia entre Operador, UI, Negocio, Repositorio y PostgreSQL. Los fragmentos alt muestran caminos excluyentes; líneas discontinuas indican retornos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfdfe"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="33" font-size="23" fill="#173047" text-anchor="start" font-weight="700">SQ04 · Guardar un pago y controlar el saldo</text><line x1="90" y1="113" x2="90" y2="1277" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="10" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="90" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Operador</text><text x="90" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Actor</text><line x1="340" y1="113" x2="340" y2="1277" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="260" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="340" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">UI / Trabajo</text><text x="340" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Qt + QThreadPool</text><line x1="630" y1="113" x2="630" y2="1277" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="550" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="630" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">ServicioGestion</text><text x="630" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Negocio</text><line x1="935" y1="113" x2="935" y2="1277" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="855" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="935" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">Repositorio</text><text x="935" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Acceso a datos</text><line x1="1230" y1="113" x2="1230" y2="1277" stroke="#bfd0d7" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1150" y="62" width="160" height="56" rx="10" fill="#e9f3f0" stroke="#d7e4e9"/><text x="1230" y="85" font-size="16" fill="#173047" text-anchor="middle" font-weight="600">PostgreSQL</text><text x="1230" y="105" font-size="11" fill="#173047" text-anchor="middle" font-weight="400">Persistencia</text><line x1="90" y1="158" x2="340" y2="158" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="100" y="142" font-size="12" fill="#173047" text-anchor="start" font-weight="400">1. Guardar pago a proveedor</text><line x1="340" y1="208" x2="630" y2="208" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350" y="192" font-size="12" fill="#173047" text-anchor="start" font-weight="400">2. guardar(pagos_proveedores, ...)</text><path d="M 630 276 h 205 v 23 h -205" fill="none" stroke="#087f72" marker-end="url(#arrow)"/><text x="640" y="242" font-size="12" fill="#173047" text-anchor="start" font-weight="400">3. Validar monto positivo y</text><text x="640" y="260" font-size="12" fill="#173047" text-anchor="start" font-weight="400">fecha</text><line x1="630" y1="350" x2="935" y2="350" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="334" font-size="12" fill="#173047" text-anchor="start" font-weight="400">4. Abrir sesión de escritura</text><line x1="935" y1="400" x2="1230" y2="400" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="384" font-size="12" fill="#173047" text-anchor="start" font-weight="400">5. Adquirir bloqueo transaccional</text><line x1="630" y1="450" x2="935" y2="450" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="434" font-size="12" fill="#173047" text-anchor="start" font-weight="400">6. guardar(pago)</text><line x1="935" y1="500" x2="1230" y2="500" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="484" font-size="12" fill="#173047" text-anchor="start" font-weight="400">7. INSERT / UPDATE del pago provisional</text><line x1="630" y1="550" x2="935" y2="550" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="534" font-size="12" fill="#173047" text-anchor="start" font-weight="400">8. saldo_orden() para órdenes afectadas</text><line x1="935" y1="600" x2="1230" y2="600" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="584" font-size="12" fill="#173047" text-anchor="start" font-weight="400">9. SELECT total y SUM(monto_pagado)</text><line x1="1230" y1="650" x2="935" y2="650" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="945" y="634" font-size="12" fill="#173047" text-anchor="start" font-weight="400">10. Total y pagos acumulados</text><line x1="935" y1="700" x2="630" y2="700" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="640" y="684" font-size="12" fill="#173047" text-anchor="start" font-weight="400">11. Devolver saldo de la orden</text><rect x="30" y="732" width="1340" height="500" rx="0" fill="none" stroke="#9db7bf"/><text x="48" y="756" font-size="14" fill="#087f72" text-anchor="start" font-weight="700">alt [pagado ≤ total en cada orden]</text><line x1="935" y1="807" x2="1230" y2="807" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="791" font-size="12" fill="#173047" text-anchor="start" font-weight="400">12. COMMIT y cerrar conexión</text><line x1="630" y1="857" x2="340" y2="857" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="841" font-size="12" fill="#173047" text-anchor="start" font-weight="400">13. Operación completada</text><line x1="340" y1="925" x2="90" y2="925" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="100" y="891" font-size="12" fill="#173047" text-anchor="start" font-weight="400">14. Cerrar formulario y recargar</text><text x="100" y="909" font-size="12" fill="#173047" text-anchor="start" font-weight="400">lista</text><line x1="30" y1="957" x2="1370" y2="957" stroke="#6d8b98" stroke-width="1.6" stroke-dasharray="6 5"/><text x="48" y="981" font-size="14" fill="#087f72" text-anchor="start" font-weight="700">[pagado &gt; total en alguna orden]</text><line x1="630" y1="1032" x2="935" y2="1032" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="640" y="1016" font-size="12" fill="#173047" text-anchor="start" font-weight="400">15. ErrorValidacion al salir de sesion()</text><line x1="935" y1="1082" x2="1230" y2="1082" stroke="#087f72" stroke-width="1.6" marker-end="url(#arrow)"/><text x="945" y="1066" font-size="12" fill="#173047" text-anchor="start" font-weight="400">16. ROLLBACK y cerrar conexión</text><line x1="630" y1="1132" x2="340" y2="1132" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="350" y="1116" font-size="12" fill="#173047" text-anchor="start" font-weight="400">17. Informar sobrepago</text><line x1="340" y1="1200" x2="90" y2="1200" stroke="#087f72" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="100" y="1166" font-size="12" fill="#173047" text-anchor="start" font-weight="400">18. Mostrar error; conservar</text><text x="100" y="1184" font-size="12" fill="#173047" text-anchor="start" font-weight="400">formulario</text></g></svg>